# BLACK HEATHER lock screen
background {
    monitor =
    path = ~/.config/black-heather/wallpaper/black-heather-highlands.png
    blur_passes = 2
    blur_size = 5
    brightness = 0.55
    contrast = 0.9
    vibrancy = 0.15
}

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Time
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(231, 225, 233, 0.96)
    font_size = 76
    font_family = JetBrainsMono Nerd Font
    position = 0, 150
    halign = center
    valign = center
}

# Date / theme inscription
label {
    monitor =
    text = cmd[update:3600000] date +"%A  ·  %d %B"
    color = rgba(197, 166, 208, 0.95)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 72
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 54
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(165, 138, 174, 0.9)
    inner_color = rgba(21, 25, 28, 0.86)
    font_color = rgb(231, 225, 233)
    fade_on_empty = false
    placeholder_text = <i>Enter passphrase</i>
    rounding = 14
    position = 0, -70
    halign = center
    valign = center
}
