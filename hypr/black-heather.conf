# BLACK HEATHER — Arcane Highlands
# Loaded as an overlay from ~/.config/hypr/hyprland.conf

$bh = ~/.config/black-heather
$terminal = kitty --config ~/.config/black-heather/kitty/kitty.conf
$launcher = rofi -show drun -theme ~/.config/black-heather/rofi/black-heather.rasi

# Monitor: use panel's preferred native mode; no guessed resolution.
monitor = ,preferred,auto,1

# UK keyboard layout; touchpad-friendly laptop defaults.
input {
    kb_layout = gb
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = yes
        tap-to-click = yes
        disable_while_typing = yes
        clickfinger_behavior = yes
    }
}

general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(a58aae ee) rgba(748b70 ee) 45deg
    col.inactive_border = rgba(343b43 cc)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 12
    active_opacity = 0.97
    inactive_opacity = 0.93

    shadow {
        enabled = yes
        range = 18
        render_power = 3
        color = rgba(08090eee)
    }

    blur {
        enabled = yes
        size = 5
        passes = 2
        new_optimizations = yes
        xray = false
        noise = 0.02
        contrast = 0.92
        brightness = 0.82
    }
}

animations {
    enabled = yes
    bezier = bh-smooth, 0.22, 1, 0.36, 1
    bezier = bh-snap, 0.16, 1, 0.3, 1
    animation = windows, 1, 5, bh-smooth, popin 80%
    animation = windowsOut, 1, 4, bh-snap, popin 80%
    animation = border, 1, 6, bh-smooth
    animation = fade, 1, 5, bh-smooth
    animation = workspaces, 1, 5, bh-snap, slide
}

dwindle {
    pseudotile = yes
    preserve_split = yes
}

misc {
    vfr = true
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

# Start the theme's services. Existing Athena services are not stopped.
exec-once = hyprpaper --config ~/.config/black-heather/hypr/hyprpaper.conf
exec-once = waybar -c ~/.config/black-heather/waybar/config.jsonc -s ~/.config/black-heather/waybar/style.css
exec-once = mako --config ~/.config/black-heather/mako/config

# Wallpaper service configuration is stored separately.
# Shortcuts
$mainMod = SUPER
bind = $mainMod, RETURN, exec, kitty --config ~/.config/black-heather/kitty/kitty.conf
bind = $mainMod, D, exec, rofi -show drun -theme ~/.config/black-heather/rofi/black-heather.rasi
bind = $mainMod, L, exec, hyprlock -c ~/.config/black-heather/hyprlock/hyprlock.conf
bind = $mainMod SHIFT, W, exec, ~/.config/black-heather/scripts/set-wallpaper.sh
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Laptop controls
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
